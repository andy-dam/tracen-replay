name: Release

# Every push to main builds the images from that commit, pushes them to
# GHCR tagged by the commit and as latest, and, when the Azure secrets are
# set, deploys the API and the client. The Oracle worker pulls latest on
# its own schedule (deploy/oracle/cloud-init.yaml).
#
# Secrets (repository settings): AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID for the OIDC sign-in of the deploy job (a service
# principal with Contributor on the resource group and a federated
# credential for this repository's main branch);
# AZURE_STATIC_WEB_APPS_API_TOKEN for the client. Variables: TRACEN_RG (the
# resource group), TRACEN_API_BASE (the API origin the client calls, e.g.
# https://api.example.com).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/tracen-replay-worker
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/tracen-replay

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Worker image (amd64 for Azure jobs, arm64 for the Oracle instance)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
            ${{ env.WORKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Service image (the API on Azure, the worker command on Oracle)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    name: Windows bundle
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          choco install nsis --no-progress -y
          Add-Content $env:GITHUB_PATH "$(go env GOPATH)\bin"
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
      - name: Build the application, the zip and the installer
        shell: pwsh
        run: ./desktop/build-windows.ps1 -Version ${{ github.ref_name }} -Out dist/windows -Installer
      - name: A short analysis inside the bundle
        shell: pwsh
        run: |
          $b = "dist/windows/tracen-replay"
          & "$b/python/python.exe" desktop/smoke.py "$b/analyzer" "$b/ffmpeg" "$b/models" cpu
          if ($LASTEXITCODE -ne 0) { throw "the bundled analyzer failed its short analysis" }
      - name: Attach them to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/tracen-replay-windows-${{ github.ref_name }}.zip
            dist/windows/TracenReplay-Setup-${{ github.ref_name }}.exe

  bundle-macos:
    name: macOS bundle
    if: github.ref_type == 'tag'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the application and the disk image
        run: sh desktop/build-macos.sh "${{ github.ref_name }}" dist/macos
      - name: A short analysis inside the bundle
        run: |
          res="dist/macos/Tracen Replay.app/Contents/Resources"
          "$res/python/bin/python3" desktop/smoke.py "$res/analyzer" "$res/ffmpeg" "$res/models" cpu
      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/macos/TracenReplay-macos-arm64-${{ github.ref_name }}.dmg

  api:
    name: Deploy the API
    needs: images
    if: vars.TRACEN_RG != '' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point the container app at this commit's image
        run: az containerapp update --name tracen-replay --resource-group ${{ vars.TRACEN_RG }} --image ${{ env.APP_IMAGE }}:${{ github.sha }} --output none
      # The analyses run as a job from the same image; without this the site
      # moves on and the analyzer stays where the last manual deploy left it.
      # An execution already running keeps the image it started with.
      - name: Point the analysis job at this commit's image
        run: az containerapp job update --name tracen-analysis --resource-group ${{ vars.TRACEN_RG }} --image ${{ env.APP_IMAGE }}:${{ github.sha }} --output none

  web:
    name: Deploy the client
    if: vars.TRACEN_API_BASE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build against the hosted API
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.TRACEN_API_BASE }}
        run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: internal/webassets/dist
          skip_app_build: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (frame extraction test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (frame extraction test)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: go vet ./...
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  web:
    name: Browser client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build into internal/webassets/dist
        run: npm run build

  python:
    name: Python worker contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install the package with the OCR runtime (CPU provider on Linux, DirectML build on Windows)
        run: python -m pip install -e ".[vision]"
      - name: Unit and contract tests (tests that need local models or recordings skip themselves)
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

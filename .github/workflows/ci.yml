name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  go:
    name: Go service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    services:
      # The store tests run on PostgreSQL as well as SQLite on Linux; the
      # service container is absent on Windows and the tests skip it there.
      postgres:
        image: ${{ runner.os == 'Linux' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: tracen
          POSTGRES_DB: tracen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (frame extraction test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (frame extraction test)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: go vet ./...
      - name: Test with the race detector (store tests on PostgreSQL)
        if: runner.os == 'Linux'
        env:
          TRACEN_TEST_POSTGRES_URL: postgres://postgres:tracen@127.0.0.1:5432/tracen?sslmode=disable
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  web:
    name: Browser client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build into internal/webassets/dist
        run: npm run build

  python:
    name: Python worker contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install the package with the OCR runtime (CPU provider on Linux, DirectML build on Windows)
        run: python -m pip install -e "./analyzer[vision]"
      - name: Unit and contract tests (the tests that need local recordings live in analyzer/lab/tests and are not run here)
        run: python -X utf8 -m unittest discover -s analyzer/tests -t analyzer -p "test_*.py"

  image:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image
        run: docker build --target worker -t tracen-replay-worker:ci .
      - name: Build the application image on top of it
        run: docker build --target app -t tracen-replay:ci .
      - name: The worker answers the identity query
        run: docker run --rm tracen-replay-worker:ci --worker-version
      - name: The application starts, is ready and reports healthy
        run: |
          docker run -d --name tracen -p 8765:8765 tracen-replay:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/readyz && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8765/healthz
          echo
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' tracen)" = healthy ] && break
            sleep 2
          done
          docker inspect --format 'health: {{.State.Health.Status}}' tracen
          [ "$(docker inspect --format '{{.State.Health.Status}}' tracen)" = healthy ]
          docker logs tracen
          docker rm -f tracen
      # `docker images` reports the unpacked size in every image store;
      # `docker image inspect` reports the compressed size under the
      # containerd store and the unpacked one under overlay2.
      - name: Image sizes (unpacked)
        run: |
          {
            echo '| Image | Size |'
            echo '| --- | ---: |'
            for image in tracen-replay-worker:ci tracen-replay:ci; do
              echo "| $image | $(docker images --format '{{.Size}}' "$image") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

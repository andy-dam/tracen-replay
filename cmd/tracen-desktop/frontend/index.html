<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tracen Replay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1218; color: #cdd6f4; font: 15px system-ui, sans-serif; }
    main { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #3ec9a7; animation: pulse 1s infinite alternate; }
    @keyframes pulse { to { opacity: 0.2; } }
    p { margin: 0; opacity: 0.8; }
  </style>
</head>
<body>
<main>
  <div class="dot"></div>
  <p id="msg">Starting</p>
</main>
<script>
  // The application is served by this process on a loopback port it chose;
  // the process moves the window there as soon as this page is up. If that
  // has not happened after a while, the loading page says so.
  setTimeout(() => {
    document.getElementById("msg").textContent = "The application did not start. Close the window and try again.";
  }, 30000);
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracen-replay"
version = "0.1.0"
description = "Local timestamped video evidence for Tracen Replay"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
analysis = ["Pillow>=10,<14"]
vision = ["Pillow>=10,<14", "rapidocr==3.9.2", "onnxruntime-directml==1.24.4; sys_platform == 'win32'", "onnxruntime==1.29.0; sys_platform != 'win32'"]
# Training the learned readers (tools/train_reader.py) only; the analyzer
# itself runs an exported model through onnxruntime from the vision extra.
train = ["torch>=2.9", "torchvision>=0.24", "onnx>=1.17"]

[project.scripts]
tracen-replay = "tracen_replay.cli:main"

[tool.setuptools.packages.find]
include = ["tracen_replay*"]

[tool.setuptools.package-data]
tracen_replay = ["data/*.json"]
